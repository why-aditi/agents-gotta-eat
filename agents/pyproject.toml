[project]
name = "gottaeat-agents"
version = "0.1.0"
description = "Agents Gotta Eat house agents (LangGraph workers)"
requires-python = ">=3.12,<3.13"
dependencies = [
    "attrs>=26.1.0",
    "fastapi>=0.143.0",
    "httpx>=0.28.1",
    "jsonschema>=4.26.0",
    "langgraph>=1.2.14",
    "pydantic>=2.14.1",
    "structlog>=26.1.0",
    "uvicorn[standard]>=0.54.0",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 120
target-version = "py312"
# Generated by `pnpm openapi:python`; never hand-edited, so never linted or reformatted here.
extend-exclude = ["gottaeat_sdk"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
strict = true
python_version = "3.12"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"

[dependency-groups]
dev = [
    "mypy>=2.4.0",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.1",
    "respx>=0.23.1",
    "ruff>=0.17.0",
    "types-jsonschema>=4.26.0.20261006",
]
